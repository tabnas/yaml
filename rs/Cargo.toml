[package]
name = "tabnas-yaml"
version = "0.5.22"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "A core-subset YAML grammar plugin for the tabnas parsing engine"
repository = "https://github.com/tabnas/yaml"

[lib]
name = "tabnas_yaml"
path = "src/lib.rs"

[dependencies]
# The engine and the relaxed-JSON grammar this plugin layers on are both
# consumed as SIBLING CHECKOUTS, the standard tabnas development model:
# clone https://github.com/tabnas/parser and https://github.com/tabnas/jsonic
# next to this repo. Both are on crates.io, but this committed manifest
# stays path-only (crates-release.yml rewrites the paths into crates.io
# requirements when it publishes), so there is no registry version to fall
# back on.
tabnas = { package = "tabnas-parser", path = "../../parser/rs" }
tabnas-jsonic = { path = "../../jsonic/rs" }
indexmap = "2"
regex = "1.10"
serde_json = { version = "1.0", features = ["preserve_order"] }

[dev-dependencies]
# The shared fixture loader, runner and divergence register: one loader in
# three languages, so the rows mean the same thing in every runtime.
tabnas-support = { path = "../../support/rs", features = ["serde_json"] }
